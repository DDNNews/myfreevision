<meta name="apple-mobile-web-app-title" content="MyFreeVision">

<style>
:root{
  --bg:#F0EDE5; --card:#E8E3D8; --text:#35332E; --muted:#8D8980; --accent:#D97757; --line:#D8D2C6;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --bh:46px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--serif);font-size:17px;line-height:1.55;min-height:100vh}
h1,h2,h3{font-weight:600;line-height:1.2;letter-spacing:-.01em}
h1{font-size:2rem;margin-bottom:.25rem}
h2{font-size:1.3rem;margin-bottom:.5rem}
h3{font-size:1.05rem}
p{margin-bottom:.6rem}
.muted{color:var(--muted);font-size:.9rem}
.eyebrow{font-family:var(--sans);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--text);padding:.6rem 1rem;z-index:99}
.skip:focus{left:8px;top:8px}

/* Layout */
.app{display:flex;min-height:100vh}
nav.side{display:none}
main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:1.4rem 1.1rem calc(6.5rem + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:.35rem .4rem calc(.35rem + env(safe-area-inset-bottom));gap:.2rem;z-index:10;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.navbtn{font-family:var(--sans);font-size:.78rem;background:none;border:0;color:var(--muted);padding:.65rem .8rem;min-height:44px;border-radius:10px;white-space:nowrap;cursor:pointer}
.navbtn[aria-current="page"]{background:var(--card);color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
@media(min-width:900px){
  nav.tabs{display:none}
  nav.side{display:flex;flex-direction:column;gap:.15rem;width:230px;padding:1.6rem 1rem;border-right:1px solid var(--line);position:sticky;top:var(--bh);height:calc(100vh - var(--bh));overflow-y:auto}
  nav.side .brand{font-size:1.3rem;font-weight:600;margin-bottom:1.2rem;padding-left:.6rem}
  nav.side .brand span{color:var(--accent)}
  nav.side .navbtn{text-align:left;font-size:.9rem}
  main{padding:2.4rem 2.4rem 3rem}
}

/* Bausteine */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.15rem;margin-bottom:.9rem}
.grid{display:grid;gap:.9rem;grid-template-columns:1fr}
@media(min-width:640px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack>*+*{margin-top:.5rem}
button,.btn{font-family:var(--sans);font-size:.9rem;min-height:44px;padding:.55rem 1rem;border-radius:10px;border:1px solid var(--text);background:transparent;color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--text);font-weight:600}
button.small{min-height:36px;padding:.3rem .7rem;font-size:.8rem}
button.ghost{border-color:var(--line);color:var(--muted)}
button:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,textarea,select{font-family:var(--serif);font-size:1rem;width:100%;min-height:44px;padding:.55rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
textarea{min-height:84px;resize:vertical}
label{font-family:var(--sans);font-size:.78rem;color:var(--muted);display:block;margin-bottom:.2rem}
.tag{font-family:var(--sans);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--accent);color:var(--text);border-radius:99px;padding:.1rem .55rem;display:inline-block}
.tag.ext{background:var(--bg)}
.bar{height:10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.big{font-size:2.2rem;font-weight:600;line-height:1}
.check{display:flex;gap:.7rem;align-items:center;min-height:44px;padding:.2rem 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:24px;min-height:24px;height:24px;accent-color:#D97757;flex:none}
.check .t{flex:1}
.check.done .t{color:var(--muted);text-decoration:line-through}
.x{background:none;border:0;color:var(--muted);min-height:36px;padding:0 .5rem}
.quote{font-size:1.45rem;line-height:1.35;font-style:italic}
.drops{display:flex;gap:.45rem;flex-wrap:wrap}
.drop{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--accent);background:var(--bg);padding:0;font-size:.75rem;color:var(--muted)}
.drop.on{background:var(--accent);color:var(--text)}
.timer{font-size:3.4rem;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:.5rem;height:110px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-family:var(--sans);font-size:.7rem;color:var(--muted)}
.bars b{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px}
.vcard{min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.vcard h3{font-size:1.2rem}
.hr{border:0;border-top:1px solid var(--line);margin:1rem 0}
details{border-top:1px solid var(--line);padding:.6rem 0}
summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.5rem + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-family:var(--sans);font-size:.85rem;z-index:30}
@media(min-width:900px){.toast{bottom:1.5rem}}

/* Banner (Laufband) */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.banner{position:sticky;top:0;z-index:12;min-height:calc(var(--bh) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:var(--accent);color:var(--text);border-bottom:1px solid var(--text);display:flex;align-items:center}
.ticker{flex:1;overflow:hidden;white-space:nowrap}
.ticker-track{display:inline-flex;width:max-content;animation:tick linear infinite}
.ticker-track span{padding-right:3.5rem;font-size:1.05rem;font-style:italic;font-weight:600}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker:hover .ticker-track,.banner.paused .ticker-track{animation-play-state:paused}
.bpause{min-height:36px;margin:0 .5rem;padding:.2rem .7rem;font-size:.75rem;border-color:var(--text);flex:none}
@media(prefers-reduced-motion:reduce){
  .ticker{white-space:normal;overflow:visible;text-align:center;padding:.5rem .8rem}
  .ticker-track{display:block;width:auto}
  .ticker-track span:not(:first-child){display:none}
  .ticker-track span{padding:0}
  .bpause{display:none}
}
/* Post-its */
.postits{display:grid;gap:.8rem;grid-template-columns:repeat(2,1fr);padding:.4rem .3rem 1rem}
@media(min-width:640px){.postits{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.postits{grid-template-columns:repeat(4,1fr)}}
.postit{min-height:78px;padding:.55rem .65rem .4rem;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);border-radius:4px;box-shadow:2px 3px 0 var(--line);transform:rotate(var(--r,0deg));transition:transform .15s;animation:bob 4.8s ease-in-out infinite alternate}
.postit:hover,.postit:focus-within{animation:none;transform:rotate(0deg) scale(1.06)}
.postit:nth-child(2n){animation-duration:4.1s;animation-delay:-1s}
.postit:nth-child(3n){animation-duration:5.7s;animation-delay:-2.4s}
.postit:nth-child(5n){animation-delay:-3.3s}
@keyframes bob{from{transform:rotate(var(--r,0deg)) translateY(0)}to{transform:rotate(calc(var(--r,0deg) + 1.4deg)) translateY(-4px)}}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.card{animation:drift 7s ease-in-out infinite alternate}
.card:nth-child(2n){animation-duration:8.5s;animation-delay:-2s}
.card:nth-child(3n){animation-duration:6.2s;animation-delay:-4s}
.card:hover,.card:focus-within{animation-play-state:paused}
.postit.c0{background:var(--card)}
.postit.c1{background:var(--accent);border-color:var(--accent);color:var(--text)}
.postit.c2{background:var(--bg);border-color:var(--muted)}
.postit .pw{font-size:1.02rem;font-style:italic;line-height:1.25;font-weight:600;overflow-wrap:anywhere}
.postit .pa{display:flex;justify-content:space-between;align-items:center;gap:.3rem;margin-top:.5rem}
.postit .pa button{min-height:36px;padding:0 .3rem;border:0;background:none;font-family:var(--sans);font-size:.72rem;color:var(--text);text-decoration:underline}
.postit.pinned .pa button[data-act="npin"]{font-weight:700}
.postit.big{min-height:96px}
.postit .plabel{font-family:var(--sans);font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.postits.six{grid-template-columns:repeat(3,1fr);padding:.3rem .2rem .6rem}
@media(min-width:900px){.postits.six{grid-template-columns:repeat(6,1fr)}}
.postits.six .postit{min-height:68px}
.postits.six .pw{font-size:.95rem}
.postit.l-de{background:var(--bg);border-color:var(--muted);color:var(--text)}
.postit.l-en{background:var(--card);border-color:var(--line);color:var(--text)}
.postit.l-pt{background:var(--accent);border-color:var(--accent);color:var(--text)}
.postit.l-fr{background:var(--line);border-color:var(--muted);color:var(--text)}
.postit.l-es{background:var(--muted);border-color:var(--text);color:var(--text)}
.postit.l-uk{background:var(--text);border-color:var(--text);color:var(--bg)}
html.calm .postit,html.calm .card{animation:none!important}
.vlist{display:flex;flex-direction:column}
.vitem{display:flex;gap:.75rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line);min-width:0}
.vitem:last-child{border-bottom:0}
.vplay{flex:none;width:56px;height:40px;min-height:40px;padding:0;border-radius:8px;border:0;background:var(--accent);color:var(--text);font-size:1rem}
.vmeta{flex:1;min-width:0}
.vmeta b{display:block;font-weight:600;line-height:1.3}
.vmeta span{font-family:var(--sans);font-size:.75rem;color:var(--muted)}
.vlinks{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.2rem}
.vlinks a,.vlinks button{font-family:var(--sans);font-size:.75rem;color:var(--text);background:none;border:0;padding:.2rem 0;min-height:32px;text-decoration:underline;margin-right:.6rem}
.vframe{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--text);margin:.6rem 0}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.card.novib{animation:none!important}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.6rem 0}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:.3rem .8rem;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:.82rem;text-decoration:none}
.chip:hover{border-color:var(--accent)}
.ytbar{display:flex;gap:.5rem;flex-wrap:wrap}
.ytbar input{flex:1;min-width:0;flex-basis:180px}
.vhero{display:flex;flex-direction:column;gap:.4rem}
.vhero .vplay{width:100%;height:auto;min-height:52px;font-family:var(--sans);font-size:.95rem;font-weight:600}
html.calm .ticker{white-space:normal;overflow:visible;text-align:center;padding:.5rem .8rem}
html.calm .ticker-track{display:block;width:auto;animation:none!important}
html.calm .ticker-track span:not(:first-child){display:none}
html.calm .ticker-track span{padding:0}
html.calm .bpause{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

var SP_TOTAL=2700,SP_WARM=300,SP_COOL=300,wlock=null;
var sp={name:(S.sportStyle&&WORKOUTS[S.sportStyle])?S.sportStyle:"Ganzkörper",sec:SP_TOTAL,run:false,end:0};
function wakeOn(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){wlock=l}).catch(function(){})}catch(e){}}
function wakeOff(){try{if(wlock)wlock.release();wlock=null}catch(e){}}
function spPhase(){
  if(sp.sec<=0)return "Geschafft";
  if(!sp.run&&sp.sec===SP_TOTAL)return "Bereit";
  var el=SP_TOTAL-sp.sec,ex=WORKOUTS[sp.name];
  if(el<SP_WARM)return "Aufwärmen: locker gehen, Arme kreisen, Schultern lockern";
  if(sp.sec<=SP_COOL)return "Cool-down: dehnen und ruhig atmen";
  var m=el-SP_WARM,i=Math.floor(m/60),w=m%60;
  return w<45?"Jetzt: "+ex[i%ex.length]+" · noch "+(45-w)+" s":"Pause · gleich: "+ex[(i+1)%ex.length];
}

function drawTimer(){

function appCard(){
  return '<div class="card novib"><h2>App aktualisieren</h2><p>Version <b>'+APP_VERSION+'</b>. Die App läuft ohne Internet mit der gespeicherten Version.</p>'+(updAvail?'<p><span class="tag">Neu</span> Version '+esc(updAvail)+' ist verfügbar.</p>':'')+

  '<p class="muted" style="margin-top:.6rem">„Neueste Version laden“ holt mit Internet die aktuelle Version von '+APP_URL.replace(/^https:\/\//,"").replace(/\/$/,"")+' und startet die App neu. Ihre Daten bleiben erhalten. „In Chrome öffnen“ zeigt die Web-Version in Chrome.</p></div>';

function canUpdate(){return "serviceWorker" in navigator&&"caches" in window&&/^https?:$/.test(location.protocol)}
function fetchVersion(){return fetch("version.json?u="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){return String(j.v||"")})}
function checkUpdateQuiet(){
  if(!canUpdate()||!navigator.onLine)return;
  fetchVersion().then(function(v){if(v&&v!==APP_VERSION){updAvail=v;if(cur==="dash"||cur==="data")render()}}).catch(function(){});
}
function appUpdate(force){
  if(!canUpdate())return toast("Updates gibt es nur in der installierten App.");
  if(!navigator.onLine)return toast("Keine Internetverbindung. Die App läuft weiter mit Version "+APP_VERSION+".");
  toast("Suche nach Update …");
  fetchVersion().then(function(v){
    if(!force&&v===APP_VERSION&&!updAvail){toast("Sie haben die neueste Version ("+APP_VERSION+").");return}
    var t=Date.now();
    return caches.open("myfreevision").then(function(c){
      return Promise.all(APP_FILES.map(function(f){
        return fetch(f+"?u="+t,{cache:"no-store"}).then(function(r){
          if(!r.ok)throw new Error(f);
          var puts=[c.put(f,r.clone())];if(f==="index.html")puts.push(c.put("./",r.clone()));return Promise.all(puts);
        });
      }));
    }).then(function(){
      return navigator.serviceWorker.getRegistration().then(function(r){if(r)return r.update().catch(function(){})});
    }).then(function(){toast("Update auf Version "+v+" installiert. App startet neu.");setTimeout(function(){location.reload()},1200)});
  }).catch(function(){toast("Update fehlgeschlagen. Bitte später erneut versuchen.")});
}
